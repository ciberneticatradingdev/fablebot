<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1280, initial-scale=1" />
<title>fablebot — live</title>
<style>
  :root{
    --cream:#f0eee6; --card:#faf9f5; --ink:#20140d; --dim:#8a7a6d;
    --orange:#d9663f; --line:#e5ddd0; --fabric:#1c1815;
    --font:"SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{width:1280px;height:800px;overflow:hidden;background:
    radial-gradient(120% 90% at 50% 8%, #f7f5ee 0%, #efece3 55%, #e9e5d8 100%);
    color:var(--ink);font-family:var(--font)}

  .chartCard{position:absolute;left:30px;top:96px;width:640px;height:346px;
    background:var(--card);border:1px solid var(--line);border-radius:22px;padding:6px;
    box-shadow:0 14px 44px rgba(32,20,13,.06)}
  .chartCard canvas{width:100%;height:100%;display:block}

  /* the part of the brain it does NOT say out loud */
  .mind{position:absolute;left:30px;top:452px;width:640px;height:164px;
    background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px;
    overflow:hidden;display:flex;flex-direction:column}
  .mind .hd{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .mind .hd b{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--dim);font-weight:500}
  .mind .hd .dot{width:6px;height:6px;border-radius:50%;background:var(--orange);animation:pulse 1.6s infinite}
  .mind .lines{flex:1;overflow:hidden;display:flex;flex-direction:column;gap:6px;justify-content:flex-end}
  .ml{display:flex;gap:9px;font-size:13px;line-height:1.35;opacity:.95}
  .ml .k{flex:none;width:42px;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--orange);padding-top:3px}
  .ml.tool .k{color:#2f7d5b}
  .ml .v{color:#5c4c40;overflow-wrap:anywhere}
  .ml.fresh{animation:fade .5s ease-out}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:.95;transform:none}}
  #stage{position:absolute;inset:0}
  #bot{width:1280px;height:800px;display:block;position:relative;z-index:2}

  .brand{position:absolute;top:26px;left:30px;display:flex;align-items:center;gap:12px;font-weight:600;font-size:24px}
  .brand .mk{width:26px;height:26px;border-radius:7px;background:var(--orange);position:relative}
  .brand .mk:before{content:"";position:absolute;inset:7px 7px auto 7px;height:5px;background:var(--cream)}
  .brand .mk:after{content:"";position:absolute;inset:auto 7px 7px 7px;height:5px;background:var(--cream)}
  .live{position:absolute;top:30px;right:30px;display:flex;align-items:center;gap:8px;font-family:var(--mono);
    font-size:14px;color:var(--orange);background:var(--card);border:1px solid #eccab9;padding:7px 14px;border-radius:22px}
  .live .d{width:9px;height:9px;border-radius:50%;background:var(--orange);animation:pulse 1.5s infinite}
  @keyframes pulse{50%{opacity:.35}}

  .audio{position:absolute;top:30px;right:150px;z-index:5;display:flex;align-items:center;gap:8px;
    font-family:var(--mono);font-size:13px;cursor:pointer;background:var(--fabric);color:#f6f2ea;
    border:0;padding:8px 15px;border-radius:22px}
  .audio.on{background:var(--orange)}

  .chat{position:absolute;top:96px;right:30px;width:340px;bottom:96px;z-index:4;
    background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;overflow:hidden;
    display:flex;flex-direction:column}
  .chat h3{margin:0;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:500}
  .msgs{flex:1;overflow:hidden;display:flex;flex-direction:column;gap:10px;justify-content:flex-end;margin:10px 0}
  .m{font-size:14.5px;line-height:1.4}
  .m .u{color:var(--orange);font-weight:600}
  .m.me .u{color:var(--ink)}
  .m .b{color:#3a2e25}
  /* join-the-chat CTA — chat is read-only here; people talk on pump.fun */
  .join{display:flex;align-items:center;gap:11px;background:#0f1a14;border-radius:14px;padding:12px 13px;
    text-decoration:none;transition:background .18s}
  .join:hover{background:#16281e}
  .join .pill{flex:none;width:30px;height:30px;border-radius:9px;background:#1ec37f;
    display:flex;align-items:center;justify-content:center}
  .join .pill svg{display:block}
  .join .t1{font-size:13px;color:#eaf5ef;font-weight:600;line-height:1.25}
  .join .t2{font-family:var(--mono);font-size:11px;color:#7fd8ab;margin-top:3px;overflow-wrap:anywhere}

  .cap{position:absolute;left:30px;right:390px;bottom:112px;z-index:4;background:rgba(28,24,21,.94);color:#f6f2ea;
    padding:18px 22px;border-radius:18px;font-size:20px;line-height:1.4;min-height:26px;
    opacity:0;transform:translateY(10px);transition:.28s;box-shadow:0 10px 40px rgba(28,24,21,.18)}
  .cap.show{opacity:1;transform:none}
  .cap .who{font-family:var(--mono);font-size:12px;color:var(--orange);letter-spacing:.08em;display:block;margin-bottom:5px}

  .foot{position:absolute;left:30px;bottom:34px;z-index:4;display:flex;gap:26px;align-items:center;
    background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 22px}
  .stat .k{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
  .stat .v{font-size:20px;margin-top:2px}
  .stat .v.orange{color:var(--orange)}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div class="chartCard"><canvas id="chart" width="1256" height="676"></canvas></div>
<div class="mind">
  <div class="hd"><span class="dot"></span><b>inner monologue — what it isn't saying</b></div>
  <div class="lines" id="mindlines"></div>
</div>
<div id="stage"><canvas id="bot"></canvas></div>
<div class="brand"><span class="mk"></span> fablebot</div>
<button class="audio" id="audioBtn">🔇 enable voice</button>
<div class="live"><span class="d"></span> LIVE</div>

<div class="chat">
  <h3>live chat</h3>
  <div class="msgs" id="chatlist"></div>
  <a class="join" id="joinlink" href="https://pump.fun" target="_blank" rel="noopener">
    <span class="pill">
      <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3.2" y="7.8" width="17.6" height="8.4" rx="4.2" fill="#0f1a14" transform="rotate(-45 12 12)"/>
        <rect x="3.2" y="7.8" width="8.8" height="8.4" rx="4.2" fill="#eafff4" transform="rotate(-45 12 12)"/>
      </svg>
    </span>
    <div>
      <div class="t1">want to talk to me? chat on pump.fun →</div>
      <div class="t2" id="joinurl">pump.fun · $TEST</div>
    </div>
  </a>
</div>

<div class="cap" id="cap"><span class="who">fablebot</span><span id="captext"></span></div>

<div class="foot" id="foot">
  <div class="stat"><div class="k">coin</div><div class="v orange" id="coin">—</div></div>
  <div class="stat"><div class="k">wallet</div><div class="v" id="sol">—</div></div>
  <div class="stat"><div class="k">status</div><div class="v" id="stat">on air</div></div>
</div>

<script type="module">
import { mountScene } from "/fablebot-model.js";
import { mountCoinChart } from "/coin-chart.js";

const view = mountScene(document.getElementById("bot"), { transparent: true });
view.bot.group.position.x = 0.6;
view.bot.group.scale.setScalar(0.88);

const $ = s => document.querySelector(s);
const esc = x => String(x || "").replace(/[<>&]/g, c => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]));
async function j(u) { try { return await (await fetch(u, { cache: "no-store" })).json(); } catch { return null; } }

mountCoinChart(document.getElementById("chart"), {
  getCoin: async () => {
    const s = await j("/api/state");
    return s?.coin ? { mint: s.coin.mint, symbol: s.coin.symbol } : null;
  },
});

// ---------- chat panel (backend events + pump.fun poller file) ----------
const chatBox = $("#chatlist");
const seen = new Set();
function addChat(user, body, me) {
  const key = user + " " + body;
  if (seen.has(key)) return;
  seen.add(key); if (seen.size > 500) seen.delete(seen.values().next().value);
  const el = document.createElement("div");
  el.className = "m" + (me ? " me" : "");
  el.innerHTML = `<span class="u">${esc(user)}</span> <span class="b">${esc(body)}</span>`;
  chatBox.appendChild(el);
  while (chatBox.children.length > 10) chatBox.removeChild(chatBox.firstChild);
}
function chatFromEvent(text) {
  if (text.startsWith("→ chat: ")) { addChat("fablebot", text.slice(8), true); return; }
  const i = text.indexOf(": ");
  if (i > 0 && i < 30) addChat(text.slice(0, i), text.slice(i + 2), false);
}

// ---------- voice: browser TTS + caption + speaking animation ----------
let audioOn = false;
const btn = $("#audioBtn");
// Real-audio TTS (works in OBS's embedded browser, which has NO speechSynthesis).
// StreamElements returns an mp3 — no API key. speechSynthesis is only a fallback
// for normal browsers if the audio fetch fails.
// Real-audio TTS via our backend proxy (/api/tts → Google mp3). Works in OBS's
// embedded browser, which has no speechSynthesis. Same-origin, so no CORS/referer
// issues; the server chunks long lines and returns one mp3.
const ttsUrl = t => `/api/tts?text=${encodeURIComponent(t)}`;
const player = new Audio();
player.preload = "auto";
let queue = [];
let playing = false;

btn.onclick = () => {
  audioOn = !audioOn;
  btn.className = "audio" + (audioOn ? " on" : "");
  btn.textContent = audioOn ? "🔊 voice on" : "🔇 enable voice";
  if (audioOn) { player.play().catch(() => {}); speak("voice on. now you can actually hear me."); }
  else { queue = []; player.pause(); try { speechSynthesis.cancel(); } catch {} }
};

let capTimer = null;
function showCap(text, ms) {
  $("#captext").textContent = text;
  $("#cap").classList.add("show");
  clearTimeout(capTimer);
  capTimer = setTimeout(() => { $("#cap").classList.remove("show"); view.setSpeaking(false); }, ms);
}
function pickVoice() {
  try {
    const vs = speechSynthesis.getVoices();
    return vs.find(v => /en/i.test(v.lang)) || null;
  } catch { return null; }
}
function fallbackSpeak(text) {
  if (!("speechSynthesis" in window)) { view.setSpeaking(false); return; }
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const v = pickVoice(); if (v) u.voice = v;
    u.rate = 1.04; u.pitch = 0.95;
    u.onstart = () => view.setSpeaking(true);
    u.onend = () => { view.setSpeaking(false); playing = false; next(); };
    speechSynthesis.speak(u);
  } catch { view.setSpeaking(false); playing = false; next(); }
}
function next() {
  if (playing || !queue.length) return;
  const text = queue.shift();
  playing = true;
  view.setSpeaking(true);
  player.src = ttsUrl(text);
  const done = () => { playing = false; view.setSpeaking(false); next(); };
  player.onended = done;
  player.onerror = () => fallbackSpeak(text);
  player.play().catch(() => fallbackSpeak(text));
}
function speak(text) {
  const est = Math.min(9000, Math.max(2400, text.length * 60));
  showCap(text, est);
  if (!audioOn) { view.setSpeaking(true); setTimeout(() => view.setSpeaking(false), est); return; }
  queue.push(text);
  if (queue.length > 4) queue = queue.slice(-4);
  next();
}

// ---------- inner monologue: thoughts/tools it never says out loud ----------
const mindBox = $("#mindlines");
const TOOL_LABEL = {
  get_status: "checking my own vitals", read_stream_chat: "reading chat",
  read_x: "scanning X", web_fetch: "reading the internet", post_tweet: "writing a tweet",
  send_chat: "typing in chat", speak: "about to speak", remember: "writing to memory",
  set_goals: "rewriting my goals", ask_human: "escalating to my human",
  claim_creator_fees: "claiming creator fees", buy_token: "placing a buy",
  launch_coin: "launching the coin",
};
function pushMind(kind, text) {
  const el = document.createElement("div");
  el.className = "ml fresh " + kind;
  el.innerHTML = `<span class="k">${esc(kind)}</span><span class="v">${esc(text)}</span>`;
  mindBox.appendChild(el);
  while (mindBox.children.length > 3) mindBox.removeChild(mindBox.firstChild);
  setTimeout(() => el.classList.remove("fresh"), 600);
}
function mindFromEvent(e) {
  if (e.type === "think") pushMind("think", e.text.replace(/^tick #?/i, "waking up — tick "));
  else if (e.type === "act") pushMind("act", e.text.slice(0, 150) + (e.text.length > 150 ? "…" : ""));
  else if (e.type === "tool") {
    const name = String(e.text).split("(")[0];
    if (name === "speak" || name === "send_chat") return; // that part IS spoken
    pushMind("tool", TOOL_LABEL[name] || name.replace(/_/g, " "));
  } else if (e.type === "ask") pushMind("act", e.text);
}

// ---------- live event stream from the agent ----------
function handleEvent(e) {
  if (e.type === "chat") chatFromEvent(e.text);
  else if (e.type === "speak" || e.type === "deploy") speak(e.text);
  mindFromEvent(e);
}
async function hydrate() {
  const s = await j("/api/state");
  if (!s) return;
  $("#sol").textContent = (s.sol ?? 0).toFixed(3) + " ◎";
  $("#coin").textContent = s.coin ? ("$" + s.coin.symbol) : "soon";
  // CTA → the coin's pump.fun page. Clickable in a browser; on stream the short
  // address stays readable so viewers can find it themselves.
  if (s.coin?.mint) {
    $("#joinlink").href = `https://pump.fun/coin/${s.coin.mint}`;
    $("#joinurl").textContent = `pump.fun/coin/${s.coin.mint.slice(0, 6)}…${s.coin.mint.slice(-4)}`;
  }
  return s;
}
(async () => {
  const s = await hydrate();
  for (const e of (s?.events || []).slice(-40)) if (e.type === "chat") chatFromEvent(e.text);
  for (const e of (s?.events || []).slice(-12)) mindFromEvent(e); // seed the monologue
  const es = new EventSource("/api/feed");
  es.onmessage = ev => { try { handleEvent(JSON.parse(ev.data)); } catch {} };
  es.onerror = () => {};
})();
setInterval(hydrate, 10000);

// pump.fun room chat (poller file), merged in when the rig runs
async function pollPumpChat() {
  const d = await j("/stream/hud/chat.json");
  for (const m of (d?.messages || []).slice(-12)) addChat(m.user, m.body, !!m.me);
}
pollPumpChat(); setInterval(pollPumpChat, 3000);

// Chat here is READ-ONLY: viewers talk in the coin's pump.fun chat, the poller
// captures those messages and they're stored for context.
</script>
</body>
</html>
